<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>dastdaroz ID — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"/>
<style>
/* ─── Переменные ─────────────────────────────────────────────── */
:root {
  --acc:    #1a9e4a;
  --acc2:   #22c55e;
  --accd:   rgba(26,158,74,.1);
  --red:    #dc2626;
  --amber:  #d97706;
  --tx:     #111111;
  --tx2:    #555555;
  --tx3:    #aaaaaa;
  --b:      #e0e0e0;
  --s2:     #f6f6f6;
  --s3:     #ebebeb;
  --r:      16px;
  --fd:     'Unbounded', sans-serif;
  --fs:     'Inter', system-ui, sans-serif;
  --ease:   cubic-bezier(.32, 0, .18, 1);
  --tf:     .13s;
}

/* ─── Сброс ──────────────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}
body {
  background: #fff;
  color: var(--tx);
  font-family: var(--fs);
  min-height: 100svh;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 52px 24px 32px;
}

/* ─── Скрытые служебные элементы ────────────────────────────── */
#fb-bar, #ldot-1, #ldot-2, #status-bar { display: none !important; }

/* ─── Обёртка ────────────────────────────────────────────────── */
.wrap {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  animation: fadeUp .28s var(--ease) both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

/* ─── Логотип ────────────────────────────────────────────────── */
.logo {
  display: flex;
  justify-content: center;
  margin-bottom: 36px;
}
.logo img {
  height: 46px;
  width: auto;
  object-fit: contain;
}

/* ─── Заголовок ──────────────────────────────────────────────── */
.hd { text-align: center; margin-bottom: 20px; }
.form-title {
  font-family: var(--fd);
  font-weight: 900;
  font-size: 1.5rem;
  color: var(--tx);
  letter-spacing: -.04em;
  line-height: 1.15;
  margin-bottom: 6px;
}
.form-title em { color: var(--tx); font-style: normal; }
.form-sub { font-size: .88rem; color: var(--tx3); line-height: 1.5; }

/* ─── Вкладки ────────────────────────────────────────────────── */
.tabs {
  display: flex;
  border-bottom: 1.5px solid var(--b);
  margin-bottom: 16px;
}
.tab {
  flex: 1;
  padding: 9px 4px 11px;
  text-align: center;
  border: none;
  background: none;
  cursor: pointer;
  font-family: var(--fs);
  font-size: .8rem;
  font-weight: 600;
  color: var(--tx3);
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1.5px;
  transition: color var(--tf), border-color var(--tf);
}
.tab.active { color: var(--acc); border-bottom-color: var(--acc); font-weight: 700; }
.tab:hover:not(.active) { color: var(--tx2); }

/* ─── Алерт ──────────────────────────────────────────────────── */
.alert {
  display: none;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  margin-bottom: 10px;
  border-radius: 12px;
  font-size: .75rem;
  color: var(--tx2);
  line-height: 1.5;
  border: 1px solid;
}
.alert.show { display: flex; }
.alert.err  { background: rgba(220,38,38,.03); border-color: rgba(220,38,38,.15); }
.alert strong {
  display: block;
  font-size: .7rem;
  font-weight: 700;
  margin-bottom: 2px;
  color: var(--red);
}

/* ─── Поля ───────────────────────────────────────────────────── */
.field { position: relative; margin-bottom: 10px; }
.lbl {
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--tx3);
  display: block;
  margin-bottom: 6px;
  font-weight: 700;
}
.field-err { font-size: .64rem; color: var(--red); margin-top: 5px; display: none; }
.field-err.show { display: block; }

/* ─── Инпут ──────────────────────────────────────────────────── */
.inp {
  width: 100%;
  background: #fff;
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  color: var(--tx);
  font-family: var(--fs);
  font-size: .95rem;
  font-weight: 400;
  padding: 17px 18px;
  outline: none;
  transition: border-color var(--tf), box-shadow var(--tf);
}
.inp:focus      { border-color: var(--acc); box-shadow: 0 0 0 3px var(--accd); }
.inp.has-eye    { padding-right: 52px; }
.inp.err        { border-color: rgba(220,38,38,.45); animation: shake .3s ease; }
.inp::placeholder { color: var(--tx3); }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  22%,66% { transform: translateX(-5px); }
  44%,88% { transform: translateX(5px); }
}

/* ─── Поле телефона ──────────────────────────────────────────── */
.phone-field {
  display: flex;
  align-items: center;
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  background: #fff;
  overflow: hidden;
  transition: border-color var(--tf), box-shadow var(--tf);
}
.phone-field.err         { border-color: rgba(220,38,38,.45); }
.phone-field:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--accd); }

.phone-prefix {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 17px 4px 17px 18px;
  background: transparent;
  border: none;
  font-family: var(--fs);
  font-weight: 600;
  font-size: .95rem;
  color: var(--tx);
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
  transition: opacity var(--tf);
}
.phone-prefix:hover { opacity: .65; }
.phone-flag {
  width: 22px;
  height: 15px;
  border-radius: 3px;
  flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(0,0,0,.09);
  object-fit: cover;
  display: block;
}
.phone-prefix-arrow { font-size: .52rem; color: var(--tx3); margin-left: 1px; }

.phone-input {
  flex: 1;
  min-width: 0;
  border: none;
  background: none;
  outline: none;
  color: var(--tx);
  font-family: var(--fs);
  font-size: .95rem;
  font-weight: 500;
  padding: 17px 18px 17px 10px;
  letter-spacing: .04em;
}
.phone-input::placeholder { color: var(--tx3); font-weight: 400; }

/* ─── Кнопка показа пароля ───────────────────────────────────── */
.eye {
  position: absolute;
  right: 0; top: 0;
  width: 52px; height: 100%;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--tx3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--tf);
}
.eye:hover { color: var(--tx2); }

/* ─── Надёжность пароля ──────────────────────────────────────── */
.ps-bars { display: flex; gap: 4px; margin-top: 8px; }
.ps-bar {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--s3);
  transition: background .3s;
}
.ps-lbl { font-size: .62rem; color: var(--tx3); margin-top: 5px; display: none; }

/* ─── Чип с номером телефона ─────────────────────────────────── */
.phone-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  padding: 11px 14px;
  margin-bottom: 20px;
  background: var(--s2);
}
.phone-chip-ico {
  width: 28px; height: 28px;
  border-radius: 8px;
  flex-shrink: 0;
  background: #fff;
  border: 1px solid var(--b);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--tx2);
  flex: 1;
  font-family: var(--fs);
  font-weight: 700;
  font-size: .85rem;
  color: var(--tx);
  letter-spacing: .02em;
}
.phone-chip-edit {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--tx);
  font-weight: 700;
  font-family: var(--fs);
  padding: 5px 9px;
  border-radius: 8px;
  background: var(--s3);
  display: flex;
  align-items: center;
  gap: 3px;
  transition: opacity var(--tf);
}
.phone-chip-edit:hover { opacity: .7; }

/* ─── Забыли пароль ──────────────────────────────────────────── */
.opt-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.forgot {
  font-size: .73rem;
  color: var(--tx3);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--fs);
  padding: 0;
  transition: color var(--tf);
  text-decoration: none;
}
.forgot:hover { color: var(--tx); }

/* ─── Условия использования ──────────────────────────────────── */
.terms-check { margin-top: 18px; margin-bottom: 10px; }
.terms-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.terms-checkbox { display: none; }
.terms-box {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  border: 1.5px solid var(--b);
  border-radius: 5px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color var(--tf), background var(--tf), box-shadow var(--tf);
}
.terms-checkbox:checked + .terms-box {
  background: var(--acc);
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--accd);
}
.terms-checkbox:checked + .terms-box::after {
  content: '';
  display: block;
  width: 5px;
  height: 9px;
  border: 2px solid #fff;
  border-top: none;
  border-left: none;
  transform: rotate(45deg) translate(-1px, -1px);
}
.terms-box.err { border-color: rgba(220,38,38,.45); }
.terms-text { font-size: .69rem; color: var(--tx3); line-height: 1.6; }
.terms-text a, .terms-text button {
  color: var(--acc);
  text-decoration: none;
}
.terms-text button {
  background: none; border: none; padding: 0;
  font-size: inherit; font-family: inherit; line-height: inherit;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.terms-text a:hover, .terms-text button:hover { text-decoration: underline; }
.terms-err { font-size: .64rem; color: var(--red); margin-top: 5px; display: none; }
.terms-err.show { display: block; }

/* ─── Кнопка отправки ────────────────────────────────────────── */
.btn-submit {
  width: 100%;
  padding: 18px;
  background: var(--acc);
  border: none;
  border-radius: var(--r);
  color: #fff;
  font-family: var(--fd);
  font-weight: 900;
  font-size: 1rem;
  letter-spacing: .01em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity .15s, transform .15s;
}
.btn-submit:hover:not(:disabled)  { opacity: .88; }
.btn-submit:active:not(:disabled) { transform: scale(.98); }
.btn-submit:disabled               { background: var(--s3); color: var(--tx3); cursor: not-allowed; }
.btn-submit.loading .btn-txt       { opacity: .4; }

.spinner {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  animation: spin .7s linear infinite;
  display: none;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn-submit.loading .spinner { display: block; }

/* ─── Переключение форм ──────────────────────────────────────── */
.switch { text-align: center; margin-top: 14px; font-size: .75rem; color: var(--tx3); }
.switch button {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--acc);
  font-size: .75rem;
  font-family: var(--fs);
  font-weight: 700;
  padding: 0;
  transition: opacity var(--tf);
}
.switch button:hover { opacity: .7; }

/* ─── Кнопка «Отправить СМС заново» ─────────────────────────── */
.btn-sms {
  width: 100%;
  margin-top: 10px;
  padding: 18px;
  background: var(--s3);
  border: none;
  border-radius: var(--r);
  color: var(--tx3);
  font-family: var(--fd);
  font-weight: 900;
  font-size: 1rem;
  letter-spacing: .01em;
  cursor: not-allowed;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  transition: color var(--tf), background .2s, opacity var(--tf);
}
.btn-sms:not(:disabled) {
  cursor: pointer;
  background: var(--acc);
  color: #fff;
}
.btn-sms:not(:disabled):hover  { opacity: .88; }
.btn-sms:not(:disabled):active { transform: scale(.98); }
.btn-sms-cd {
  font-family: var(--fs);
  font-weight: 600;
  font-size: .9rem;
  color: var(--tx3);
  margin-left: 6px;
  transition: opacity .2s;
}
.btn-sms-cd.hidden { display: none; }

/* ─── OTP-кубики ─────────────────────────────────────────────── */
.otp-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 20px;
}
.otp-box {
  flex: 1;
  max-width: 70px;
  height: 84px;
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  background: #fff;
  text-align: center;
  font-family: var(--fd);
  font-size: 1.75rem;
  font-weight: 900;
  color: var(--tx);
  outline: none;
  caret-color: var(--acc);
  transition: border-color .13s, box-shadow .13s, opacity .13s;
  -webkit-appearance: none;
  appearance: none;
}
.otp-box:focus  { border-color: var(--acc); box-shadow: 0 0 0 3px var(--accd); }
.otp-box.filled { border-color: var(--acc); }

/* Ошибка — красное свечение + тряска */
.otp-box.err {
  border-color: rgba(220,38,38,.6);
  box-shadow: 0 0 0 3px rgba(220,38,38,.13);
  animation: shake .4s ease;
}

/* Загрузка — зелёный шиммер */
@keyframes otpShimmer {
  0%   { background-position: -300% 0; }
  100% { background-position:  300% 0; }
}
.otp-box.loading {
  border-color: var(--acc);
  background: linear-gradient(90deg,
    #fff 20%,
    rgba(26,158,74,.1) 50%,
    #fff 80%
  );
  background-size: 300% 100%;
  animation: otpShimmer 1.1s ease-in-out infinite;
  pointer-events: none;
}
.otp-box:disabled { cursor: not-allowed; }

</style>
</head>
<body>

<!-- Служебные элементы (нужны для JS-совместимости) -->
<div id="fb-bar"></div>
<div id="ldot-1"></div>
<div id="ldot-2"></div>
<div id="status-bar">
  <span id="status-dot"></span>
  <span id="status-text"></span>
</div>

<div class="wrap" role="main">

  <!-- Логотип -->
  <div class="logo">
    <img src="dastdaroz_id.png" alt="dastdaroz ID"/>
  </div>

  <!-- Заголовок -->
  <div class="hd">
    <div class="form-title" id="card-title">Добро <em>пожаловать</em></div>
    <div class="form-sub"   id="card-sub">Войдите с помощью номера телефона</div>
  </div>

  <!-- Алерт ошибки -->
  <div class="alert err" id="lock-alert" role="alert">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px">
      <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16v.01" stroke-linecap="round"/>

    <div><strong id="alert-title"></strong><span id="alert-msg"></span></div>

  <!-- ═══════════════ ФОРМА ВХОДА ═══════════════ -->

      <div class="terms-check">

          <button type="button" onclick="SheetPdf.open('terms')">Публичной офертой</button> и

        </span>

  </div>

</div><!-- /.wrap -->



<script type="module">
import { auth, db } from './firebase.js';
import { SheetPdf } from './sheet-pdf.js';
import {
  onAuthStateChanged,
  signInWithCustomToken,
  setPersistence,
  browserLocalPersistence,
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';

// ─── Константы ────────────────────────────────────────────────
const API_BASE = 'https://api.dastdaroz.shop';
const HOME         = 'dashboard.html';
const PHONE_DOMAIN = 'phone.dastdaroz.id';

// ─── PDF Sheets (Оферта / Политика) ───────────────────────────
SheetPdf.define({
  id:     'terms',
  title:  'Публичная оферта',
  url:    'https://dastdaroz.shop/help/terms.pdf',
  zIndex: 900,
});
SheetPdf.define({
  id:     'privacy',
  title:  'Политика конфиденциальности',
  url:    'https://dastdaroz.shop/help/privacy.pdf',
  zIndex: 900,
});

// Экспорт в window для onclick в HTML
window.SheetPdf = SheetPdf;

// ─── Rate Limiter ─────────────────────────────────────────────
const RL = (() => {
  const SK          = 'rl_v1';
  const MAX_FAILS   = 5;
  const WIN_MS      = 15 * 60_000;
  const LOCKOUTS_MS = [30_000, 120_000, 900_000, 3_600_000];
  const G_MAX       = 30;
  const G_WIN_MS    = 10 * 60_000;

  const load = () => {
    try { return JSON.parse(sessionStorage.getItem(SK) || '{}'); }
    catch { return {}; }
  };
  const save = s => {
    try { sessionStorage.setItem(SK, JSON.stringify(s)); }
    catch {}
  };

  function check(key) {
    const now = Date.now();
    const s   = load();
    const e   = s[key];
    if (!e) return { ok: true, fails: 0 };
    if (e.until && now < e.until) return { ok: false, until: e.until };
    if (!e.until && now - e.first > WIN_MS) {
      delete s[key]; save(s);
      return { ok: true, fails: 0 };
    }
    return { ok: true, fails: e.fails || 0 };
  }

  function fail(key) {
    const now = Date.now();
    const s   = load();
    let e     = s[key];

    if (!e || (!e.until && now - e.first > WIN_MS)) {
      e = { fails: 0, lockouts: 0, first: now };
    }
    if (e.until && now >= e.until) {
      e.fails = 0;
      delete e.until;
      e.first = now;
    }

    e.fails = (e.fails || 0) + 1;

    if (e.fails >= MAX_FAILS) {
      const dur  = LOCKOUTS_MS[Math.min(e.lockouts, LOCKOUTS_MS.length - 1)];
      e.until    = now + dur;
      e.lockouts = (e.lockouts || 0) + 1;
      e.fails    = 0;
      e.first    = now;
    }

    s[key] = e;
    save(s);
    return check(key);
  }

  function success(key) {
    const s = load();
    delete s[key];
    save(s);
  }

  function checkGlobal() {
    const now = Date.now();
    const s   = load();
    const g   = s['__g'] || { t: [] };
    g.t = g.t.filter(x => now - x < G_WIN_MS);
    if (g.t.length >= G_MAX) { s['__g'] = g; save(s); return false; }
    g.t.push(now);
    s['__g'] = g;
    save(s);
    return true;
  }

  return { check, fail, success, checkGlobal, MAX_FAILS };
})();

// ─── Таймер блокировки ────────────────────────────────────────
let _cdTimer = null;

function startLockout(until) {
  if (_cdTimer) clearInterval(_cdTimer);
  _loginLocked = true;
  setOtpDisabled(true);

  const tick = () => {
    const sec = Math.ceil((until - Date.now()) / 1000);
    if (sec <= 0) {
      clearInterval(_cdTimer);
      _cdTimer     = null;
      _loginLocked = false;
      setOtpDisabled(false);
      hideAlert();
      return;
    }
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    const t = m > 0 ? `${m}:${String(s).padStart(2, '0')}` : `${s} с`;
    showAlert('Доступ временно ограничен',
      `Слишком много неверных попыток. Повторите через: ${t}`);
  };
  tick();
  _cdTimer = setInterval(tick, 1000);
}

// ─── Утилиты ──────────────────────────────────────────────────
const digitsOnly = v => (v || '').replace(/\D/g, '');

function normalizePhone(raw) {
  let d = digitsOnly(raw);
  if (d.startsWith('992')) d = d.slice(3);
  else if (d.startsWith('8') && d.length === 10) d = d.slice(1);
  return d.length === 9 ? d : null;
}

function formatPhoneDisplay(d9) {
  return '+992 ' + d9.slice(0,2) + ' ' + d9.slice(2,5) + ' ' + d9.slice(5,7) + ' ' + d9.slice(7,9);
}

const phoneToPseudoEmail = d9 => `992${d9}@${PHONE_DOMAIN}`;

function attachPhoneMask(input) {
  input.addEventListener('input', () => {
    let d = digitsOnly(input.value).slice(0, 9), out = '';
    if (d.length > 0) out  = d.slice(0, 2);
    if (d.length > 2) out += ' ' + d.slice(2, 5);
    if (d.length > 5) out += ' ' + d.slice(5, 7);
    if (d.length > 7) out += ' ' + d.slice(7, 9);
    input.value = out;
  });
}

// ─── DOM-ссылки ───────────────────────────────────────────────
const alertEl      = document.getElementById('lock-alert');

const loginStep2   = document.getElementById('login-step-2');

const otpBoxes      = [0,1,2,3].map(i => document.getElementById('otp-' + i));

attachPhoneMask(loginPhone);

let loginPhoneDigits = null;

// ─── Состояние авторизации ────────────────────────────────────

// ─── Переключение форм ────────────────────────────────────────

  clearAllErrors();
  goLoginStep(1);
  if (_cdTimer) { clearInterval(_cdTimer); _cdTimer = null; _loginLocked = false; }
}



// ─── Алерты и ошибки полей ────────────────────────────────────
const showAlert  = (title, msg) => {
  alertTitle.textContent = title;
  alertMsg.textContent   = ' ' + msg;
  alertEl.className      = 'alert err show';
};
const hideAlert  = ()       => { alertEl.className = 'alert err'; };

function showFieldErr(id, msg) {
  document.getElementById(id)?.classList.add('err');
  const err = document.getElementById('err-' + id);
  if (err) { err.textContent = msg; err.classList.add('show'); }
}
function clearFieldErr(id) {
  document.getElementById(id)?.classList.remove('err');
  const err = document.getElementById('err-' + id);
  if (err) { err.textContent = ''; err.classList.remove('show'); }
}
function clearAllErrors() {
  clearFieldErr('login-phone');
  otpBoxes.forEach(b => b.classList.remove('err'));
  otpErrEl.textContent = '';
  otpErrEl.classList.remove('show');
  hideAlert();
}

loginPhone.addEventListener('input', () => {
  if (_cdTimer) return;
  clearFieldErr('login-phone');
  hideAlert();
});

// ─── Таймер «Отправить СМС заново» ───────────────────────────
let _smsTimer = null;
const SMS_CD  = 60;

function startSmsCountdown() {
  clearSmsCountdown();
  let sec = SMS_CD;
  btnResendSms.disabled = true;
  smsCountdown.classList.remove('hidden');
  smsCountdown.textContent = '· ' + sec;

  _smsTimer = setInterval(() => {
    sec--;
    if (sec <= 0) {
      clearInterval(_smsTimer);
      _smsTimer = null;
      smsCountdown.classList.add('hidden');
      btnResendSms.disabled = false;
    } else {
      smsCountdown.textContent = '· ' + sec;
    }
  }, 1000);
}

function clearSmsCountdown() {
  if (_smsTimer) { clearInterval(_smsTimer); _smsTimer = null; }
  btnResendSms.disabled = true;
  smsCountdown.textContent = '· ' + SMS_CD;
  smsCountdown.classList.remove('hidden');
}

btnResendSms.addEventListener('click', async () => {
  if (btnResendSms.disabled || !loginPhoneDigits) return;

  btnResendSms.disabled = true;
  try {
    const r = await fetch(`${API_BASE}/api/auth/send-otp`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ phone: '992' + loginPhoneDigits }),
    });
    const data = await r.json();
    if (!r.ok) {
      showOtpErr(data.error || 'Не удалось отправить SMS');
      btnResendSms.disabled = false;
      return;
    }
    clearOtp();
    startSmsCountdown();
    setTimeout(() => otpBoxes[0].focus(), 150);
  } catch {
    showOtpErr('Ошибка сети. Проверьте подключение.');
    btnResendSms.disabled = false;
  }
});

// ─── OTP-утилиты ──────────────────────────────────────────────
function setOtpDisabled(on) {
  otpBoxes.forEach(b => { b.disabled = on; });
}
function clearOtp() {
  otpBoxes.forEach(b => { b.value = ''; b.classList.remove('err', 'filled', 'loading'); b.style.opacity = ''; b.disabled = false; });
  otpErrEl.textContent = '';
  otpErrEl.classList.remove('show');
}
function showOtpErr(msg) {
  otpBoxes.forEach(b => { b.classList.remove('loading'); b.classList.add('err'); });
  otpErrEl.textContent = msg;
  otpErrEl.classList.add('show');
}

// ─── Авто-отправка кода ───────────────────────────────────────
let _submitting = false;

async function submitCode() {
  if (_loginLocked || _submitting) return;
  const code = otpBoxes.map(b => b.value).join('');
  if (code.length < 4) return;
  if (!loginPhoneDigits) { goLoginStep(1); return; }

  if (!RL.checkGlobal()) {
    showAlert('Слишком много попыток', 'Подождите немного и попробуйте снова.');
    return;
  }

  const key     = phoneToPseudoEmail(loginPhoneDigits);
  const rlState = RL.check(key);
  if (!rlState.ok) { startLockout(rlState.until); return; }

  _submitting = true;

  // Показываем шиммер загрузки
  otpBoxes.forEach(b => { b.classList.add('loading'); b.disabled = true; });

  try {
    // 1. Верифицируем код на нашем бэкенде
    const r    = await fetch(`${API_BASE}/api/auth/verify-otp`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ phone: '992' + loginPhoneDigits, code }),
    });
    const data = await r.json();

    if (!r.ok) {
      const res  = RL.fail(key);
      const left = RL.MAX_FAILS - res.fails;
      const hint = left <= 2 ? ` Осталось попыток: ${left}.` : '';
      if (!res.ok) { clearOtp(); startLockout(res.until); _submitting = false; return; }
      // Убираем шиммер, показываем ошибку, очищаем через 600мс
      otpBoxes.forEach(b => { b.classList.remove('loading'); b.disabled = false; });
      showOtpErr((data.error || 'Неверный код.') + hint);
      setTimeout(() => { clearOtp(); _submitting = false; }, 600);
      return;
    }

    // 2. Входим в Firebase через customToken
    await setPersistence(auth, browserLocalPersistence);
    await signInWithCustomToken(auth, data.customToken);
    RL.success(key);
    statusText.textContent = 'Успешно! Перенаправление…';
    window.location.href   = HOME;

  } catch (e) {
    otpBoxes.forEach(b => { b.classList.remove('loading'); b.disabled = false; });
    showAlert('Ошибка сети', 'Проверьте подключение и попробуйте снова.');
    clearOtp();
    _submitting = false;
  }
}

// ─── OTP-ввод ─────────────────────────────────────────────────
otpBoxes.forEach((box, idx) => {
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace') {
      if (box.value) {
        box.value = '';
        box.classList.remove('filled');
      } else if (idx > 0) {
        otpBoxes[idx - 1].focus();
        otpBoxes[idx - 1].value = '';
        otpBoxes[idx - 1].classList.remove('filled');
      }
      e.preventDefault();
    }
    if (e.key === 'ArrowLeft'  && idx > 0) otpBoxes[idx - 1].focus();
    if (e.key === 'ArrowRight' && idx < 3) otpBoxes[idx + 1].focus();
  });

  box.addEventListener('input', () => {
    otpBoxes.forEach(b => b.classList.remove('err'));
    otpErrEl.textContent = '';
    otpErrEl.classList.remove('show');
    hideAlert();
    const d = box.value.replace(/\D/g, '').slice(-1);
    box.value = d;
    if (d) {
      box.classList.add('filled');
      if (idx < 3) otpBoxes[idx + 1].focus();
      else submitCode();
    } else {
      box.classList.remove('filled');
    }
  });

  box.addEventListener('paste', e => {
    e.preventDefault();
    const pasted = (e.clipboardData || window.clipboardData)
      .getData('text').replace(/\D/g, '').slice(0, 4);
    pasted.split('').forEach((ch, i) => {
      if (otpBoxes[i]) { otpBoxes[i].value = ch; otpBoxes[i].classList.add('filled'); }
    });
    const next = pasted.length < 4 ? pasted.length : 3;
    otpBoxes[next].focus();
    if (pasted.length === 4) submitCode();
  });
});

// ─── Навигация по шагам входа ─────────────────────────────────
function goLoginStep(n) {
  loginStep1.style.display = n === 1 ? '' : 'none';
  loginStep2.style.display = n === 2 ? '' : 'none';
  if (n === 2) {
    cardTitle.innerHTML = 'СМС отправлен на <em>ваш номер</em>';
    cardSub.textContent = 'Введите код, чтобы войти';
    clearOtp(); startSmsCountdown(); setTimeout(() => otpBoxes[0].focus(), 150);
  }
  if (n === 1) {
    cardTitle.innerHTML = 'Добро <em>пожаловать</em>';
    cardSub.textContent = 'Войдите с помощью номера телефона';
    setTimeout(() => loginPhone.focus(), 150); clearSmsCountdown();
  }
}

btnLoginNext.addEventListener('click', async () => {
  const d9 = normalizePhone(loginPhone.value);
  if (!d9) { showFieldErr('login-phone', 'Введите корректный номер (9 цифр)'); return; }

  const st = RL.check(phoneToPseudoEmail(d9));
  if (!st.ok) { startLockout(st.until); return; }

  // Тот же номер — просто переходим на шаг 2, SMS не шлём
  if (d9 === loginPhoneDigits) {
    phoneChipNum.textContent = formatPhoneDisplay(d9);
    goLoginStep(2);
    return;
  }

  setLoading(btnLoginNext, true);
  try {
    const r    = await fetch(`${API_BASE}/api/auth/send-otp`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ phone: '992' + d9 }),
    });
    const data = await r.json();
    if (!r.ok) {
      showFieldErr('login-phone', data.error || 'Не удалось отправить SMS');
      return;
    }
    loginPhoneDigits         = d9;
    phoneChipNum.textContent = formatPhoneDisplay(d9);
    goLoginStep(2);
  } catch {
    showFieldErr('login-phone', 'Ошибка сети. Проверьте подключение.');
  } finally {
    setLoading(btnLoginNext, false);
  }
});

btnLoginBack.addEventListener('click', () => {
  if (_cdTimer) { clearInterval(_cdTimer); _cdTimer = null; _loginLocked = false; }
  clearOtp();
  hideAlert();
  goLoginStep(1);
});

loginPhone.addEventListener('keydown', e => { if (e.key === 'Enter') btnLoginNext.click(); });

// ─── Firebase: человекочитаемые ошибки ───────────────────────
function fbErr(code) {
  const map = {
    'auth/user-not-found':            ['Аккаунт не найден',        'Аккаунт с этим номером не существует. Сначала зарегистрируйтесь.'],
    'auth/wrong-password':            ['Неверный пароль',           'Пароль неверный. Попробуйте ещё раз.'],
    'auth/invalid-credential':        ['Неверные данные',           'Номер или пароль неверны.'],
    'auth/invalid-login-credentials': ['Неверные данные',           'Номер или пароль неверны.'],
    'auth/too-many-requests':         ['Firebase: лимит запросов',  'Слишком много попыток. Подождите немного.'],
    'auth/email-already-in-use':      ['Номер уже зарегистрирован', 'Аккаунт с этим номером уже существует. Войдите.'],
    'auth/weak-password':             ['Пароль слишком простой',    'Пароль должен содержать не менее 6 символов.'],
    'auth/network-request-failed':    ['Ошибка сети',               'Проверьте подключение к интернету.'],
  };
  return map[code] || ['Произошла ошибка', 'Что-то пошло не так. Попробуйте ещё раз.'];
}

function setLoading(btn, on) {
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}
